<head>

<title>Journey Partners</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Journey Partners — the workspace for stays, restaurants, transport, tours, attractions and government on one shared dataset.">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap">
<style>:root{--bg:#F6F4FA;--surface:#FFFFFF;--sunk:#F0ECF6;--fg:#1E1A2B;--muted:#6B6480;--line:#E5E0EE;--acc:#8A4FC6;--acc-fg:#FFFFFF;--acc-soft:#F1E8FB;--acc-ink:#6D35AC;--pink:#E37FA9;--ok:#1F9D6B;--warn:#C2830C;--bad:#B23A55;--shadow:0 1px 2px rgba(40,20,70,.06),0 8px 24px -12px rgba(40,20,70,.18);--r:14px;--side:268px;--font:'Anuphan',-apple-system,'Segoe UI','Noto Sans Thai',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13111A;--surface:#1C1927;--sunk:#221E2F;--fg:#EDEAF5;--muted:#A39CB8;--line:#2F2A3F;--acc:#B489EA;--acc-fg:#1A1028;--acc-soft:#2B2240;--acc-ink:#D0B2F5;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13111A;--surface:#1C1927;--sunk:#221E2F;--fg:#EDEAF5;--muted:#A39CB8;--line:#2F2A3F;--acc:#B489EA;--acc-fg:#1A1028;--acc-soft:#2B2240;--acc-ink:#D0B2F5;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
body{margin:0}body.lock{overflow:hidden}
html[lang="th"] .en,html[lang="en"] .th{display:none}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.01em}h2{font-size:1.02rem;font-weight:600}
a{color:var(--acc-ink)}
svg{width:18px;height:18px;flex-shrink:0}
button,input,select,textarea{font:inherit;color:inherit}
.muted{color:var(--muted)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.92em}
.sp{flex:1}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 15px;border-radius:10px;border:1px solid transparent;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s;font-size:.95rem}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--acc);color:var(--acc-fg)}.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--surface);border-color:var(--line)}.btn.ghost:hover{border-color:var(--acc);color:var(--acc-ink)}
.btn.danger{background:var(--bad);color:#fff}.btn.ghost.danger{background:transparent;color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.btn.sm{height:32px;padding:0 11px;font-size:.88rem;border-radius:9px}.btn.big{height:46px;font-size:1.02rem}
.btn:disabled{opacity:.5;pointer-events:none}
.btn svg{width:17px;height:17px}
.ib{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:0;background:transparent;cursor:pointer;position:relative}.ib:hover{background:var(--sunk)}
.lnk{background:none;border:0;color:var(--acc-ink);font-weight:600;cursor:pointer;text-decoration:none;font-size:.9rem}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
/* splash */
#splash{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:200;transition:opacity .35s}#splash.out{opacity:0}
#splash img{animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.06)}}
/* auth */
#auth{min-height:100vh;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:radial-gradient(1200px 500px at 85% -10%,color-mix(in srgb,var(--pink) 18%,transparent),transparent 60%),radial-gradient(900px 500px at -10% 110%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 60%),var(--bg)}
.au-wrap{width:100%;max-width:560px;display:flex;flex-direction:column;gap:22px}
.au-brand{display:flex;align-items:flex-end;gap:10px}.au-logo{height:88px;width:auto}.au-p{font-weight:700;color:var(--acc-ink);letter-spacing:.14em;text-transform:uppercase;font-size:.8rem;padding-bottom:9px}
.au-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.au-card h1{font-size:1.75rem}.au-card h2{font-size:1.3rem}.lead{margin:0;color:var(--muted);max-width:60ch}
.au-k{display:flex;flex-wrap:wrap;gap:6px;margin-block:4px 6px}
.au-opt{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s}
.au-opt:hover{border-color:var(--acc);background:var(--acc-soft)}.au-opt.main{border-color:var(--acc);background:var(--acc-soft)}
.au-opt>span:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column}.au-opt small{color:var(--muted)}
.au-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c,var(--acc)) 14%,transparent);color:var(--c,var(--acc-ink))}
.au-note{display:flex;gap:8px;align-items:flex-start;color:var(--muted);font-size:.86rem;margin:4px 0 0}.au-note svg{width:15px;height:15px;margin-top:3px}
.au-back{align-self:flex-start}.au-foot{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.85rem}
.form.one{grid-template-columns:1fr}
/* shell */
#app{display:flex;min-height:100vh}
#side{width:var(--side);flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:14px 12px calc(20px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));z-index:40}
.sd-top{padding:4px 6px 12px}.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}.brand span{display:flex;flex-direction:column;line-height:1.1}.brand b{font-size:1.08rem}.brand small{color:var(--acc-ink);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.66rem}
.org-btn{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);cursor:pointer;text-align:left;margin-bottom:10px}.org-btn:hover{border-color:var(--acc)}
.org-n{flex:1;min-width:0;display:flex;flex-direction:column}.org-n b,.org-n small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.org-n small{color:var(--muted);font-size:.78rem}
.org-av{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;flex-shrink:0}.org-av.sm{width:28px;height:28px;border-radius:8px;font-size:.85rem}
#nav{display:flex;flex-direction:column;gap:14px}
.nv-sec{display:flex;flex-direction:column;gap:1px}.nv-sec>span{font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:4px 10px}
.nv{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:10px;color:var(--fg);text-decoration:none;font-weight:500;font-size:.93rem}
.nv:hover{background:var(--sunk)}.nv.on{background:var(--acc-soft);color:var(--acc-ink);font-weight:600}.nv svg{width:18px;height:18px;opacity:.85}
.nv .dot{margin-left:auto;font-style:normal;background:var(--pink);color:#fff;font-size:.72rem;font-weight:700;border-radius:99px;padding:0 7px;line-height:18px}
.mainc{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding-block:10px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.demo{display:flex;align-items:center;gap:10px;background:var(--acc-soft);color:var(--acc-ink);border-radius:99px;padding:4px 6px 4px 12px;font-size:.85rem}.demo>span{display:flex;align-items:center;gap:6px}.demo svg{width:15px;height:15px}
#bellN{position:absolute;top:5px;right:5px;background:var(--pink);color:#fff;font-style:normal;font-size:.66rem;font-weight:700;border-radius:99px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}
.u-av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--pink));color:#fff;display:grid;place-items:center;font-weight:700}
.only-m{display:none}
#view{padding-block:24px 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;max-width:1320px;width:100%;outline:none}
#scrim{display:none}
/* page header */
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}.vh>div:first-child{min-width:0;max-width:72ch}
.sub{margin:6px 0 0;color:var(--muted)}.vh-a{display:flex;gap:8px;flex-wrap:wrap}
/* cards, kpis */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}.card-h>div{min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.kpi-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc-ink);flex-shrink:0}
.kpi.acc .kpi-ic{background:linear-gradient(135deg,var(--acc),var(--pink));color:#fff}.kpi.warn .kpi-ic{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.kpi-m{display:flex;flex-direction:column;min-width:0}.kpi-m small{color:var(--muted);font-size:.82rem}.kpi-m b{font-size:1.55rem;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.2}.kpi-m em{font-style:normal;color:var(--muted);font-size:.8rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid2.g31{grid-template-columns:2fr 1fr}.grid2.g13{grid-template-columns:minmax(220px,1fr) 2.4fr;align-items:start}
.grid2>*{min-width:0}
/* pills, chips, tags */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:600;background:color-mix(in srgb,var(--c) 14%,transparent);color:color-mix(in srgb,var(--c) 80%,var(--fg));white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.pill.lv-info{--c:#2F7FC1}.pill.lv-warn{--c:#C2830C}.pill.lv-alert{--c:#B23A55}
.kchip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:8px;font-size:.8rem;font-weight:600;background:color-mix(in srgb,var(--c) 13%,transparent);color:color-mix(in srgb,var(--c) 78%,var(--fg))}.kchip svg{width:14px;height:14px}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;background:var(--sunk);font-size:.78rem;color:var(--muted);margin:1px 0}
.src{font-size:.82rem;color:var(--muted)}
.neg{color:var(--ok)}.pos{color:var(--warn)}
/* toolbar */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);flex:1;min-width:200px;max-width:420px}.search svg{color:var(--muted)}.search input{border:0;outline:0;background:none;flex:1;min-width:0;height:100%}
.search:focus-within{border-color:var(--acc)}
.toolbar select,.inp{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px}
.count{color:var(--muted);font-size:.86rem;margin-left:auto}
.seg,.tabs{display:inline-flex;background:var(--sunk);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button,.tabs button{border:0;background:none;padding:7px 13px;border-radius:9px;cursor:pointer;font-weight:500;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"],.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.pipe{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.pipe button{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}.pipe button b{font-size:1.3rem}.pipe button.on{border-color:var(--acc);background:var(--acc-soft)}
/* table */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card .tbl-wrap{box-shadow:none;border:0;border-radius:0;margin:-4px -6px}
.tbl{width:100%;border-collapse:collapse;font-size:.93rem}.tbl th{text-align:left;font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}.tbl .c{text-align:center}
.tbl tbody tr[tabindex]{cursor:pointer}.tbl tbody tr[tabindex]:hover{background:var(--sunk)}
.ti{width:15px;height:15px;vertical-align:-3px;color:var(--muted)}
.perm td:first-child{font-weight:500}.ok{color:var(--ok)}
/* list */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;align-items:center;gap:12px;padding:10px 8px;border-bottom:1px solid var(--line);border-radius:8px}.list li:last-child{border-bottom:0}
.list li[tabindex],.list li[data-org]{cursor:pointer}.list li[tabindex]:hover{background:var(--sunk)}.list li.on{background:var(--acc-soft)}
.lm{flex:1;min-width:0;display:flex;flex-direction:column}.lm b{font-weight:600;overflow:hidden;text-overflow:ellipsis}.lm small{color:var(--muted);font-size:.84rem;display:flex;align-items:center;gap:5px;flex-wrap:wrap}.lm small svg{width:14px;height:14px}
.when{display:flex;flex-direction:column;min-width:58px;font-variant-numeric:tabular-nums}.when small{color:var(--muted);font-size:.78rem}
.nt li.unread b::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pink);margin-right:7px;vertical-align:2px}
.pad{padding:16px}
/* hand-offs, notices */
.hand{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}.hand li{display:flex;gap:12px;align-items:center}
.hand li>span:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column}.hand small{color:var(--muted);font-size:.83rem}.hand em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums}
.hd-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);flex-shrink:0}
.gnot{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.gn{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:11px;background:color-mix(in srgb,#2F7FC1 10%,transparent);margin-bottom:6px}.gn.warn{background:color-mix(in srgb,#C2830C 13%,transparent)}.gn.alert{background:color-mix(in srgb,#B23A55 13%,transparent)}
.gn>span{display:flex;flex-direction:column}.gn small{color:var(--muted)}.gn svg{margin-top:2px}
.note,.consent{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border-radius:11px;background:var(--sunk);color:var(--muted);font-size:.88rem;margin:0}.note svg,.consent svg{width:16px;height:16px;margin-top:2px}
.consent{background:color-mix(in srgb,var(--ok) 10%,transparent);color:color-mix(in srgb,var(--ok) 70%,var(--fg))}
/* charts */
.chart{width:100%;height:auto;display:block}.chart rect{fill:color-mix(in srgb,var(--acc) 55%,transparent)}.chart rect.hi{fill:var(--acc)}.chart .grid{stroke:var(--line);stroke-dasharray:3 4}.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--font)}
.hbars{display:flex;flex-direction:column;gap:9px}.hb{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:10px;align-items:center;font-size:.9rem}.hb-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}.hb-t i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--pink))}.hb b{font-variant-numeric:tabular-nums;font-size:.86rem}
.funnel{display:flex;flex-direction:column;gap:8px}.fn{display:grid;grid-template-columns:minmax(120px,30%) 1fr 48px 48px;gap:10px;align-items:center}
.fn i{height:26px;width:var(--w);min-width:4px;border-radius:7px;background:linear-gradient(90deg,var(--acc),var(--pink))}.fn b{text-align:right;font-variant-numeric:tabular-nums}.fn small{color:var(--muted);text-align:right}
/* calendar grid */
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}.legend span{display:flex;align-items:center;gap:6px}.legend i{width:14px;height:14px;border-radius:4px}
.cal-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.cal{border-collapse:separate;border-spacing:4px;padding:6px;min-width:100%}.cal th{font-weight:500;font-size:.78rem;color:var(--muted);padding:4px}.cal thead th{text-align:center}.cal thead th b{display:block;font-size:1rem;color:var(--fg)}.cal thead th small{display:block}
.cal thead th.td b{color:var(--acc-ink)}.cal thead th.we small{color:var(--pink)}
.cal tbody th{text-align:left;min-width:190px;position:sticky;left:0;background:var(--surface);z-index:1}.cal tbody th span{display:flex;gap:7px;align-items:center;color:var(--fg);font-weight:600;font-size:.88rem}.cal tbody th svg{width:15px;height:15px;color:var(--muted)}
.cc{width:100%;min-width:52px;height:50px;border-radius:9px;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}.cc b{font-size:1rem}.cc small{font-size:.68rem;opacity:.75}
.lv0{background:color-mix(in srgb,var(--ok) 13%,transparent)}.lv1{background:color-mix(in srgb,var(--ok) 24%,transparent)}.lv2{background:color-mix(in srgb,var(--warn) 26%,transparent)}.lv3{background:color-mix(in srgb,var(--bad) 28%,transparent)}.lvx{background:repeating-linear-gradient(45deg,var(--sunk) 0 6px,var(--line) 6px 12px);color:var(--muted)}
/* journeys */
.split{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
.jlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;max-height:72vh;overflow-y:auto}
.jlist button{width:100%;text-align:left;display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}.jlist button.on{border-color:var(--acc);background:var(--acc-soft)}.jlist small{color:var(--muted)}
.jl-ic{display:flex;gap:4px;margin-top:4px}.jl-ic i{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}.jl-ic i.mine{outline:2px solid var(--acc)}.jl-ic svg{width:13px;height:13px}
.jdet{display:flex;flex-direction:column;gap:14px}
.tl{list-style:none;margin:0;padding:0 0 0 6px;display:flex;flex-direction:column}
.tl li{display:flex;gap:14px;position:relative;padding-bottom:16px}.tl li:not(:last-child)::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--line)}
.tl-dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,var(--surface));color:var(--c);flex-shrink:0;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}.tl-dot svg{width:16px;height:16px}
.tl-b{display:flex;flex-direction:column;min-width:0;padding-top:2px}.tl-b small{color:var(--muted);font-size:.8rem}.tl-b span{color:var(--muted);font-size:.86rem}
.tl li.done{opacity:.55}.tl li.next .tl-dot{box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 40%,transparent)}.tl li.mine .tl-b b{color:var(--acc-ink)}.mine-t{color:var(--acc-ink)!important;font-weight:600}
.jp{display:flex;flex-direction:column;gap:8px}.sec-l{font-size:.74rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.jp-r{display:flex;gap:10px;align-items:center}.jp-r>span:nth-child(2){flex:1;display:flex;flex-direction:column;min-width:0}.jp-r small{color:var(--muted);font-size:.82rem}
/* housekeeping */
.hk-sum{display:flex;gap:10px;flex-wrap:wrap}.hk-sum span{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:11px;background:color-mix(in srgb,var(--c) 12%,transparent);font-size:.9rem}.hk-sum b{font-size:1.2rem;color:var(--c)}
.hk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.hk{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:11px;border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));background:color-mix(in srgb,var(--c) 9%,var(--surface));cursor:pointer;text-align:left;min-height:76px}
.hk b{font-size:1.1rem}.hk span{color:var(--c);font-weight:600;font-size:.8rem}.hk small{color:var(--muted);font-size:.74rem}
.opts{display:flex;flex-direction:column;gap:8px}.opt{padding:12px 14px;border-radius:11px;border:1px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;font-weight:500}.opt:hover{border-color:var(--acc)}
/* manifest */
.run{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}.run-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.run-h b{font-size:1.05rem}
.cap{flex:1;min-width:80px;max-width:200px;height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}.cap i{display:block;height:100%;background:var(--acc)}
.pre{white-space:pre-wrap;background:var(--sunk);padding:12px;border-radius:10px;font-size:.88rem;margin:0;overflow-x:auto}
/* reviews */
.rv-sum{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}.rv-sum .big{font-size:3rem;line-height:1}.rv-sum .hbars{width:100%;margin-top:10px}.stars{color:#E6A23C;letter-spacing:2px}
.rv-list{display:flex;flex-direction:column;gap:12px;min-width:0}.rv-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.rv p{margin:8px 0}
.rv-rep{background:var(--sunk);border-radius:10px;padding:10px 12px}.rv-rep p{margin:2px 0 0}.rv-rep small{color:var(--acc-ink);font-weight:600}
.rv-form{display:flex;gap:8px;align-items:flex-end}.rv-form textarea{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);resize:vertical;min-width:0}
/* packages, network */
.pk-grid,.nw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pk-it{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}.pk-it li{display:grid;grid-template-columns:1fr auto;gap:0 10px}.pk-it small{grid-column:1;color:var(--muted);font-size:.8rem}.pk-it b{grid-row:1/3;grid-column:2;align-self:center;font-variant-numeric:tabular-nums}
.pk-f{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:.9rem;color:var(--muted)}.pk-f b{color:var(--fg)}
.pk-org{display:flex;gap:6px;align-items:center;margin-top:12px}.pk-org .btn{margin-left:auto}
.nw{display:flex;flex-direction:column;gap:10px}.nw-h{display:flex;gap:12px;align-items:center}.nw-k{display:flex;gap:5px;flex-wrap:wrap}.nw-m{display:flex;gap:14px;color:var(--muted);font-size:.85rem;flex-wrap:wrap}
.nw-a{display:flex;gap:6px;align-items:center;margin-top:auto}.vf{width:15px;height:15px;color:var(--acc);vertical-align:-2px;margin-left:4px}
/* inbox */
.chat-wrap{display:grid;grid-template-columns:330px 1fr;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);height:min(70vh,720px);min-height:460px;overflow:hidden}
.th-list{list-style:none;margin:0;padding:6px;overflow-y:auto;border-right:1px solid var(--line)}
.th-list button{width:100%;display:flex;gap:10px;align-items:center;text-align:left;padding:10px;border-radius:11px;border:0;background:none;cursor:pointer}.th-list button:hover{background:var(--sunk)}.th-list button.on{background:var(--acc-soft)}
.th-list button.unread b::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pink);margin-left:6px;vertical-align:1px}
.th-list small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}.th-list em{font-style:normal;color:var(--muted);font-size:.74rem;white-space:nowrap;align-self:flex-start}
.th-ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--acc-ink);flex-shrink:0}.th-ic svg{width:17px;height:17px}
.chat{display:flex;flex-direction:column;min-width:0;min-height:0}.chat .empty{flex:1}
.ch-h{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}.ch-back{display:none}
.ch-mem{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.msg{max-width:72%;display:flex;flex-direction:column;align-self:flex-start}.msg p{margin:0;padding:9px 13px;border-radius:16px 16px 16px 5px;background:var(--surface);border:1px solid var(--line)}.msg small{font-size:.74rem;color:var(--muted);margin:0 0 2px 6px}.msg em{font-style:normal;font-size:.7rem;color:var(--muted);margin:2px 6px 0}
.msg.me{align-self:flex-end;align-items:flex-end}.msg.me p{background:var(--acc);color:var(--acc-fg);border-color:transparent;border-radius:16px 16px 5px 16px}
.msg.sys{align-self:center;max-width:90%;text-align:center}.msg.sys p{background:var(--sunk);border:0;font-size:.84rem;color:var(--muted)}
.quick{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 0}.quick button{flex-shrink:0;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:.84rem;cursor:pointer}.quick button:hover{border-color:var(--acc)}
.ch-in{display:flex;gap:8px;padding:10px 12px 12px}.ch-in input{flex:1;min-width:0;height:42px;border-radius:12px;border:1px solid var(--line);padding:0 14px;background:var(--surface)}.ch-in .btn{height:42px;width:46px;padding:0}
/* settings */
.kset{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.kpick{display:flex;flex-wrap:wrap;gap:8px}.kp{display:flex;align-items:center;gap:8px;padding:9px 13px;border-radius:11px;border:1px solid var(--line);cursor:pointer;font-weight:500;font-size:.9rem;background:var(--surface)}
.kp input{position:absolute;opacity:0;pointer-events:none}.kp svg{color:var(--c)}.kp:has(input:checked){border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}.kp:has(input:focus-visible){outline:2px solid var(--acc)}.kp:has(input:disabled){opacity:.6}
.int{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:12px 0 16px}.int-c{display:flex;flex-direction:column;gap:4px;box-shadow:none;position:relative;padding:14px}.int-c small{color:var(--muted);padding-right:44px}.sw-l{position:absolute;top:14px;right:14px}
.row{display:flex;gap:8px}.row input{flex:1;min-width:0}
.docs li{flex-wrap:wrap}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}.steps button{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left}.steps button:hover{border-color:var(--acc)}
.steps i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc-ink);font-style:normal;font-weight:700;font-size:.85rem}.steps span{flex:1}
.seq{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}.seq li{display:flex;align-items:center;gap:12px;justify-content:space-between}.seq li>span{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.seq i{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:7px;font-style:normal;font-size:.8rem;font-weight:600;background:color-mix(in srgb,var(--c) 13%,transparent);color:color-mix(in srgb,var(--c) 78%,var(--fg))}.seq i svg{width:13px;height:13px}.seq .sep{width:14px;height:14px;color:var(--muted)}
/* forms */
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}.fld.full{grid-column:1/-1}.fld label{font-size:.84rem;font-weight:600;color:var(--muted)}.fld small{color:var(--muted);font-size:.78rem}
.fld input,.fld select,.fld textarea{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 12px;width:100%}.fld textarea{height:auto;padding:10px 12px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 20%,transparent)}
.fld .bad{border-color:var(--bad)}
.fld.tog{flex-direction:row;align-items:center;justify-content:space-between;gap:12px;grid-column:1/-1;padding:10px 0;cursor:pointer}.fld.tog span{font-weight:500}
.sw{appearance:none;width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex-shrink:0;transition:background .15s}.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}.sw:checked{background:var(--acc)}.sw:checked::after{transform:translateX(18px)}

#drawer{position:fixed;inset:0;z-index:90;background:rgba(20,10,35,0);transition:background .2s}#drawer.on{background:rgba(20,10,35,.38)}

.dr-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 14px 22px;padding-top:calc(14px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}.dr-h h2{font-size:1.15rem}
#drBody{flex:1;overflow-y:auto;padding:20px 22px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.dr-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--line);margin-top:4px}
.h3{font-size:.95rem;margin-top:6px}
.bd-top{display:flex;gap:10px;align-items:center}.bd-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.bd-grid>div{display:flex;flex-direction:column;background:var(--sunk);border-radius:11px;padding:10px 12px;min-width:0}.bd-grid small{color:var(--muted);font-size:.78rem}.bd-grid span{color:var(--muted);font-size:.84rem}
.bd-sec{display:flex;flex-direction:column;gap:10px}
/* modal, toast, empty */
#modal{position:fixed;inset:0;z-index:120;background:rgba(20,10,35,.45);display:grid;place-items:center;padding:16px}
.mbox{background:var(--surface);border-radius:16px;padding:22px;width:min(420px,100%);box-shadow:var(--shadow)}.mbox p{margin:0 0 18px}.mbtns{display:flex;gap:8px;justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:500;opacity:0;pointer-events:none;transition:all .2s;z-index:150;max-width:calc(100% - 32px)}#toast.on{opacity:1;transform:translate(-50%,0)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:40px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}.empty svg{width:34px;height:34px;color:var(--acc)}
/* responsive */
@media (max-width:1080px){.grid2,.grid2.g31,.grid2.g13{grid-template-columns:1fr}.split{grid-template-columns:1fr}.jlist{max-height:none;flex-direction:row;overflow-x:auto}.jlist li{flex:0 0 250px}}
@media (max-width:900px){
  #side{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .22s;box-shadow:10px 0 40px rgba(0,0,0,.2);padding-top:calc(14px + env(safe-area-inset-top,0px))}
  #side.open{transform:none}#side.open~#scrim{display:block;position:fixed;inset:0;background:rgba(20,10,35,.38);z-index:35}
  .only-m{display:inline-grid}
  .top{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));top:env(safe-area-inset-top,0px)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
  #view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:18px}
  h1{font-size:1.35rem}
  .pipe{grid-template-columns:1fr 1fr}
  .chat-wrap{grid-template-columns:1fr;height:calc(100vh - 210px)}.chat-wrap .chat{display:none}.chat-wrap.has-sel .th-list{display:none}.chat-wrap.has-sel .chat{display:flex}.ch-back{display:inline-flex}.msg{max-width:86%}
}
@media (max-width:640px){
  .form,.bd-grid{grid-template-columns:1fr}
  .tbl thead{display:none}.tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}.tbl tr{padding:10px 14px;border-bottom:1px solid var(--line)}.tbl tr:last-child{border-bottom:0}
  .tbl td{border:0;padding:3px 0;display:flex;justify-content:space-between;gap:12px;text-align:right}.tbl td::before{content:attr(data-l);color:var(--muted);font-size:.8rem;text-align:left;flex-shrink:0}.tbl td[data-l=""]::before{content:none}
  .tbl td:first-child{text-align:left;display:block}.tbl td:first-child::before{content:none}
  .perm td{display:flex}.perm thead{display:none}
  .demo b{display:none}.au-card{padding:20px}.vh-a{width:100%}.vh-a .btn{flex:1}
  .kpis{grid-template-columns:1fr 1fr}.kpi{padding:12px;flex-direction:column;gap:8px}.kpi-m b{font-size:1.25rem}
  .count{margin-left:0}.search{max-width:none}
  .fn{grid-template-columns:1fr 40px 40px}.cal tbody th{min-width:128px}.cal tbody th small{display:none}.fn i{grid-column:1/-1;grid-row:2}
}
.fld input.sw{width:42px;height:24px;padding:0;border:0;box-shadow:none}
</style>

/* things other parts of Journey read (same site): partner places and public announcements */
function publish(){
  if(!DB)return;
  const places=[],ann=[];
  for(const o of DB.orgs.concat(DB.net)){
    if(o.types.includes('gov'))continue;
    if(!o.listed)continue;
    o.types.forEach(k=>{const map={stay:'stay',dine:'eat',tour:'see',attraction:'see',transport:'stop'};places.push({id:o.id+':'+k,org:o.id,name:o.name,kind:map[k],ptype:k,prov:o.prov,price:o.price||0,rating:o.rating||0,verified:o.verified})});
  }
  for(const o of DB.orgs){const R=DB.res[o.id]||{};(R.ann||[]).filter(a=>a.pub).forEach(a=>ann.push({id:a.id,org:o.name,prov:a.prov,title:a.title,body:a.body,level:a.level,from:a.from,to:a.to,at:a.at||Date.now()}))}
  try{localStorage.setItem('jy_partner_pub',JSON.stringify({places,ann,at:Date.now()}))}catch(e){}
}

function drawer(title,html,bind,wide){
  const d=$('#drawer');d.classList.toggle('wide',!!wide);$('#drTitle').textContent=title;$('#drBody').innerHTML=html;d.hidden=false;requestAnimationFrame(()=>d.classList.add('on'));

function closeDrawer(){const d=$('#drawer');d.classList.remove('on');document.body.classList.remove('lock');setTimeout(()=>{d.hidden=true;$('#drBody').innerHTML=''},220)}
function confirmBox(msg,yes,danger){
  const m=$('#modal');m.innerHTML=`<div class="mbox" role="dialog" aria-modal="true"><p>${esc(msg)}</p><div class="mbtns"><button class="btn ghost" data-m="no">${T('ยกเลิก','Cancel')}</button><button class="btn ${danger?'danger':'primary'}" data-m="yes">${T('ยืนยัน','Confirm')}</button></div></div>`;m.hidden=false;
  m.onclick=e=>{const b=e.target.closest('[data-m]');if(!b&&e.target!==m)return;m.hidden=true;if(b&&b.dataset.m==='yes')yes()};
}

function field(f,v){
  const id='f_'+f.k,lab=`<label for="${id}">${esc(f.l)}</label>`;
  if(f.t==='select'){const opts=typeof f.o==='function'?f.o():f.o.map(x=>[x,optL(x)]);return `<div class="fld">${lab}<select id="${id}" data-k="${f.k}">${opts.map(([val,l])=>`<option value="${esc(val)}"${String(v)===String(val)?' selected':''}>${esc(l)}</option>`).join('')}</select></div>`}
  if(f.t==='toggle')return `<label class="fld tog" for="${id}"><span>${esc(f.l)}</span><input type="checkbox" class="sw" id="${id}" data-k="${f.k}"${v?' checked':''}></label>`;
  if(f.t==='textarea')return `<div class="fld full">${lab}<textarea id="${id}" data-k="${f.k}" rows="3">${esc(v||'')}</textarea></div>`;
  if(f.t==='tags'||f.t==='times')return `<div class="fld${f.t==='times'?' full':''}">${lab}<input id="${id}" data-k="${f.k}" data-arr="1" value="${esc((v||[]).join(', '))}" placeholder="${esc(f.ph||(f.t==='times'?'08:00, 13:00':''))}"><small>${T('คั่นด้วยเครื่องหมายจุลภาค','Separate with commas')}</small></div>`;
  return `<div class="fld">${lab}<input id="${id}" data-k="${f.k}" type="${f.t==='money'||f.t==='number'?'number':f.t||'text'}"${f.t==='money'?' min="0" step="10"':''} value="${esc(v??'')}"${f.req?' required':''}${f.ph?` placeholder="${esc(f.ph)}"`:''}></div>`;
}
function formHTML(schema,obj){return `<div class="form">${schema.filter(f=>!f.ro).map(f=>field(f,obj[f.k])).join('')}</div>`}
function readForm(root,schema,obj){let ok=true;
  schema.filter(f=>!f.ro).forEach(f=>{const el=$('[data-k="'+f.k+'"]',root);if(!el)return;let v;
    if(el.type==='checkbox')v=el.checked;else if(el.dataset.arr)v=el.value.split(',').map(x=>x.trim()).filter(Boolean);else if(el.type==='number')v=el.value===''?'':+el.value;else v=el.value.trim();
    if(f.req&&(v===''||v==null)){el.classList.add('bad');ok=false}else el.classList.remove('bad');obj[f.k]=v});
  return ok}

/* ----- charts (SVG, no library) ----- */
function bars(data,opt={}){
  const W=opt.w||640,H=opt.h||180,P=24,max=Math.max(1,...data.map(d=>d.v)),bw=(W-P)/data.length;
  return `<svg class="chart" viewBox="0 0 ${W} ${H+22}" role="img" aria-label="${esc(opt.label||'')}">${[0,.5,1].map(g=>`<line x1="${P}" x2="${W}" y1="${H-(H-10)*g}" y2="${H-(H-10)*g}" class="grid"/><text x="0" y="${H-(H-10)*g+4}" class="ax">${opt.money?compactM(max*g):Math.round(max*g)}</text>`).join('')}
  ${data.map((d,i)=>{const h=Math.max(2,(H-10)*d.v/max);return `<g><rect x="${P+i*bw+bw*.18}" y="${H-h}" width="${bw*.64}" height="${h}" rx="${Math.min(6,bw*.2)}" class="${d.hi?'hi':''}" style="${d.c?'fill:'+d.c:''}"><title>${esc(d.l)}: ${opt.money?money(d.v):num(d.v)}</title></rect>${data.length<=16||i%Math.ceil(data.length/12)===0?`<text x="${P+i*bw+bw/2}" y="${H+16}" text-anchor="middle" class="ax">${esc(d.l)}</text>`:''}</g>`}).join('')}</svg>`;
}
const compactM=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?Math.round(n/1e3)+'k':Math.round(n);
function hbars(data,opt={}){const max=Math.max(1,...data.map(d=>d.v));return `<div class="hbars">${data.map(d=>`<div class="hb"><span class="hb-l">${d.l}</span><span class="hb-t"><i style="width:${d.v/max*100}%;${d.c?'background:'+d.c:''}"></i></span><b>${opt.money?money(d.v):num(d.v)}${opt.suf||''}</b></div>`).join('')}</div>`}
function kpi(l,v,sub,ic,tone){return `<div class="kpi${tone?' '+tone:''}"><span class="kpi-ic">${SVG(IC[ic]||IC.chart)}</span><span class="kpi-m"><small>${esc(l)}</small><b>${v}</b>${sub?`<em>${sub}</em>`:''}</span></div>`}

function handoffs(){
  const o=me().id,out=[],lim=[iso(0),iso(1)];
  for(const tr of DB.trips){const L=tr.legs;for(let i=0;i<L.length;i++){const l=L[i];if(!lim.includes(l.date))continue;
    const nx=L[i+1];if(!nx)continue;
    if(nx.org===o&&l.org!==o){const from=l.org?orgById(l.org).name:T('เที่ยวบิน','Flight');out.push({time:l.time,date:l.date,fromKind:l.kind,text:T(`${cName(tr.cust)} มาจาก ${from}`,`${cName(tr.cust)} coming from ${from}`),sub:fmtD(l.date)+' · '+kLbl(l.kind)+' → '+kLbl(nx.kind)})}
    if(l.org===o&&nx.org&&nx.org!==o){out.push({time:nx.time,date:nx.date,fromKind:nx.kind,text:T(`${cName(tr.cust)} ไปต่อที่ ${orgById(nx.org).name}`,`${cName(tr.cust)} goes on to ${orgById(nx.org).name}`),sub:fmtD(nx.date)+' · '+kLbl(nx.kind)})}
  }}
  return out.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
}

function csv(name,rows){

  if(/workers\.dev$/.test(location.hostname)||location.protocol==="file:"){try{const u=URL.createObjectURL(new Blob(['﻿'+txt],{type:'text/csv'}));const a=document.createElement('a');a.href=u;a.download='journey-'+name+'-'+iso(0)+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);toast(T('ดาวน์โหลดแล้ว','Downloaded'));return}catch(e){}}
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast(T('คัดลอกข้อมูล CSV แล้ว','CSV copied to clipboard'))).catch(()=>toast(T('ดาวน์โหลดได้บนเว็บจริง','Download works on the live site')));

function journeyTimeline(tr,compact){
  const o=me().id;let shownNow=false;
  return `<ol class="tl">${tr.legs.map(l=>{const org=l.org?orgById(l.org):null,mine=l.org===o,past=(l.date+l.time)<(iso(0)+new Date().toTimeString().slice(0,5));
    const now=!past&&!shownNow;if(now)shownNow=true;
    const st=l.status==='cancelled'?'cancelled':past?'done':now?'next':'up';
    return `<li class="${st}${mine?' mine':''}"><span class="tl-dot" style="--c:${org?KINDS[org.types[0]].c:'#6F6885'}">${SVG(IC[KIND_IC[l.kind]])}</span><div class="tl-b"><small>${fmtDW(l.date)} · ${l.time}</small><b>${esc(kLbl(l.kind))}${org?' · '+esc(org.name):''}</b>${l.kind==='arrive'||l.kind==='depart'?`<span>${esc(l.item)}</span>`:mine?`<span class="mine-t">${T('บริการของคุณ','Your service')}</span>`:''}${l.status==='cancelled'?pill('cancelled'):''}</div></li>`}).join('')}</ol>`;
}
VIEWS.journeys=()=>{
  const o=me().id,q=(STATE.q.jr||'').toLowerCase(),f=STATE.f.jr=STATE.f.jr||'now';
  let trips=DB.trips.filter(t=>t.legs.some(l=>l.org===o)&&(custById(t.cust)||{}).consent);
  if(f==='now')trips=trips.filter(t=>t.arrive<=iso(1)&&t.depart>=iso(0));else if(f==='up')trips=trips.filter(t=>t.arrive>iso(1));else trips=trips.filter(t=>t.depart<iso(0));
  if(q)trips=trips.filter(t=>cName(t.cust).toLowerCase().includes(q));
  trips.sort((a,b)=>a.arrive.localeCompare(b.arrive));
  const sel=trips.find(t=>t.id===STATE.sel)||trips[0];
  return `<div class="vh"><div><h1>${T('เส้นทางลูกค้า','Customer journeys')}</h1><p class="sub">${T('ข้อมูลตั้งแต่ลูกค้าเดินทางมาถึงจนกลับ ผ่านทุกพาร์ทเนอร์ในทริป แสดงเฉพาะลูกค้าที่ยินยอมแชร์แผนการเดินทาง','From arrival to departure across every partner on the trip — only for customers who agreed to share their itinerary')}</p></div></div>
  <div class="toolbar"><div class="seg">${[['now',T('อยู่ในพื้นที่ตอนนี้','In destination now')],['up',T('กำลังจะมา','Arriving soon')],['past',T('ที่ผ่านมา','Past')]].map(([k,l])=>`<button data-jf="${k}" aria-pressed="${f===k}">${l}</button>`).join('')}</div><label class="search">${SVG(IC.search)}<input id="jrQ" value="${esc(STATE.q.jr||'')}" placeholder="${T('ค้นหาลูกค้า','Search customer')}"></label><span class="count">${trips.length} ${T('ทริป','trips')}</span></div>
  ${trips.length?`<div class="split"><ul class="jlist">${trips.map(t=>{const c=custById(t.cust);return `<li><button data-trip="${t.id}" class="${sel===t?'on':''}"><b>${esc(c.name)} ${flag(c.country)}</b><small>${fmtD(t.arrive)} – ${fmtD(t.depart)} · ${T(c.party+' ท่าน',c.party+' pax')}</small><span class="jl-ic">${t.legs.filter(l=>l.org).map(l=>`<i style="--c:${KINDS[orgById(l.org).types[0]].c}" class="${l.org===o?'mine':''}">${SVG(IC[KIND_IC[l.kind]])}</i>`).join('')}</span></button></li>`}).join('')}</ul>
   <section class="card jdet">${sel?(()=>{const c=custById(sel.cust),partners=[...new Set(sel.legs.filter(l=>l.org&&l.org!==o).map(l=>l.org))];return `<div class="card-h"><div><h2>${esc(c.name)} ${flag(c.country)}</h2><span class="muted">${fmtD(sel.arrive)} – ${fmtD(sel.depart)} · ${T(c.party+' ท่าน',c.party+' pax')} · ${T('ภาษา ','Speaks ')}${c.lang.toUpperCase()}${c.diet?' · '+esc(c.diet):''}</span></div></div>
     <p class="consent">${SVG(IC.shield)}${T('ลูกค้ายินยอมให้พาร์ทเนอร์ในทริปนี้เห็นแผนการเดินทาง เพื่อประสานงานรับส่งต่อกัน','The customer agreed to share this itinerary with partners on the trip for hand-offs')}</p>
     ${journeyTimeline(sel)}
     <div class="jp"><span class="sec-l">${T('พาร์ทเนอร์ในทริปนี้','Partners on this trip')}</span>${partners.map(id=>{const p=orgById(id);return `<div class="jp-r"><span class="org-av sm" style="background:${p.color}">${esc(p.name[0])}</span><span><b>${esc(p.name)}</b><small>${p.types.map(kName).join(' · ')}</small></span><button class="btn ghost sm" data-pmsg="${id}">${SVG(IC.chat)}</button></div>`}).join('')||`<p class="muted">${T('มีแค่คุณในทริปนี้','Only you on this trip')}</p>`}</div>

  :`<div class="empty">${SVG(IC.route,1.5)}<span>${T('ยังไม่มีทริปในช่วงนี้','No trips in this range')}</span></div>`}`;

VIEWS.housekeeping=()=>{
  const hk=R().housekeeping=R().housekeeping||{},td=iso(0),bs=myBookings().filter(b=>b.kind==='stay'&&b.status!=='cancelled');
  const units=[];(R().rooms||[]).forEach(r=>{for(let i=1;i<=r.units;i++)units.push({id:r.id+'-'+i,type:r,no:(r.id.slice(1)*100+i)})});

  const occ={};bs.filter(b=>b.date<=td&&addDk(b.date,b.nights)>td).forEach(b=>{const u=units.find(x=>x.type.id===b.item&&!occ[x.id]);if(u)occ[u.id]=b});
  const outT={};bs.filter(b=>addDk(b.date,b.nights)===td).forEach(b=>{const u=units.find(x=>x.type.id===b.item&&!outT[x.id]&&!occ[x.id]);if(u)outT[u.id]=b});

  const L={clean:[T('พร้อมขาย','Ready'),'#1F9D6B'],occupied:[T('มีแขกพัก','Occupied'),'#7A4FC8'],dirty:[T('รอทำความสะอาด','To clean'),'#D9603F'],cleaning:[T('กำลังทำความสะอาด','Cleaning'),'#C2830C'],repair:[T('แจ้งซ่อม','Maintenance'),'#6F6885']};

  return `<div class="vh"><div><h1>${T('แม่บ้าน/สถานะห้อง','Housekeeping')}</h1><p class="sub">${T('สถานะห้องวันนี้ แตะห้องเพื่อเปลี่ยนสถานะ ทีมแม่บ้านเห็นข้อมูลเดียวกัน','Today’s room status. Tap a room to change it — housekeeping sees the same board.')}</p></div></div>

VIEWS.manifest=()=>{
  const d=STATE.f.mfD||iso(0),rs=R().routes||[],bs=myBookings().filter(b=>b.kind==='transport'&&b.date===d&&b.status!=='cancelled');
  return `<div class="vh"><div><h1>${T('รายชื่อผู้โดยสาร','Passenger manifest')}</h1><p class="sub">${T('รายชื่อตามรอบรถ พร้อมจุดรับและปลายทางต่อไปของลูกค้า ส่งให้คนขับได้','Who is on each departure, where they go next — ready to send to the driver')}</p></div>
   <div class="vh-a"><input type="date" id="mfD" value="${d}" class="inp"></div></div>
  ${rs.map(r=>{const runs=(r.times||[]).map(t=>({t,ps:bs.filter(b=>b.route===r.id&&b.time===t)})).filter(x=>x.ps.length);if(!runs.length)return '';const veh=(R().fleet||[]).find(v=>v.id===r.vehicle);
    return `<section class="card"><div class="card-h"><div><h2>${esc(r.name)}</h2><span class="muted">${veh?esc(veh.plate)+' · ':''}${r.seats} ${T('ที่นั่ง','seats')}</span></div></div>${runs.map(x=>{const n=x.ps.reduce((a,b)=>a+b.qty,0);return `<div class="run"><div class="run-h"><b>${x.t}</b><span class="cap"><i style="width:${Math.min(100,n/r.seats*100)}%"></i></span><small>${n}/${r.seats}</small><button class="btn ghost sm" data-drv="${r.id}|${x.t}">${SVG(IC.idcard)}${T('ส่งให้คนขับ','Send to driver')}</button></div>
     <ul class="list">${x.ps.map(b=>{const c=custById(b.cust),tr=DB.trips.find(t=>t.id===b.trip),nx=tr&&c.consent?tr.legs[tr.legs.findIndex(l=>l.id===b.leg)+1]:null,pv=tr&&c.consent?tr.legs[tr.legs.findIndex(l=>l.id===b.leg)-1]:null;
      return `<li data-bk="${b.id}" tabindex="0"><span class="lm"><b>${esc(c.name)} ${flag(c.country)} · ${T(b.qty+' ที่',b.qty+' seats')}</b><small>${pv?T('รับจาก: ','Pick up: ')+esc(pv.kind==='arrive'?pv.item:orgById(pv.org)?.name||''):''}${nx&&nx.org?' → '+esc(orgById(nx.org).name):nx?' → '+esc(nx.item):''}${c.access?' · '+esc(c.access):''}</small></span>${pill(b.status)}</li>`}).join('')}</ul></div>`}).join('')}</section>`}).join('')||`<div class="empty">${SVG(IC.clipboard,1.5)}<span>${T('ไม่มีผู้โดยสารในวันนี้','No passengers on this day')}</span></div>`}`;
};
BIND.manifest=v=>{$('#mfD',v).onchange=e=>{STATE.f.mfD=e.target.value;render()};$$('[data-drv]',v).forEach(b=>b.onclick=()=>{const [rid,t]=b.dataset.drv.split('|'),r=(R().routes||[]).find(x=>x.id===rid),d=STATE.f.mfD||iso(0);
  const ps=myBookings().filter(x=>x.route===rid&&x.date===d&&x.time===t&&x.status!=='cancelled');
  const txt=`${r.name} · ${fmtD(d)} ${t}\n`+ps.map((x,i)=>`${i+1}. ${cName(x.cust)} (${x.qty})`).join('\n');
  drawer(T('ส่งให้คนขับ','Send to driver'),`<div class="fld full"><label>${T('เลือกคนขับ','Driver')}</label><select id="dSel">${(R().drivers||[]).filter(x=>x.status==='on').map(x=>`<option>${esc(x.name)} · ${esc(x.phone)}</option>`).join('')}</select></div><pre class="pre">${esc(txt)}</pre><div class="dr-foot"><span class="sp"></span><button class="btn ghost" id="dCp">${SVG(IC.copy)}${T('คัดลอก','Copy')}</button><button class="btn primary" id="dSend">${T('ส่งในแอปคนขับ','Send in driver app')}</button></div>`,bd=>{
    $('#dCp',bd).onclick=()=>{(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast(T('คัดลอกแล้ว','Copied'))).catch(()=>toast(T('เลือกข้อความแล้วคัดลอกเอง','Select the text to copy')))};
    $('#dSend',bd).onclick=()=>{closeDrawer();toast(T('ส่งรายชื่อให้คนขับแล้ว','Manifest sent to the driver'))}})})};

VIEWS.crowd=()=>{
  const bs=myBookings().filter(b=>b.kind==='attraction'&&b.status!=='cancelled'),hrs=[...Array(11)].map((_,i)=>8+i),d=iso(0);
  const by=hrs.map(h=>({l:pad(h)+':00',v:bs.filter(b=>b.date===d&&+b.time.slice(0,2)===h).reduce((a,b)=>a+b.party,0)}));
  const days=[...Array(14)].map((_,i)=>({l:fmtD(iso(i)),v:bs.filter(b=>b.date===iso(i)).reduce((a,b)=>a+b.party,0)}));
  return `<div class="vh"><div><h1>${T('ความหนาแน่นผู้เข้าชม','Visitor flow')}</h1><p class="sub">${T('คาดการณ์จากการจองล่วงหน้า ใช้จัดคนและแนะนำเวลาที่คนน้อยให้ลูกค้าในแอป','Forecast from advance bookings — plan staff and suggest quiet times in the app')}</p></div></div>
  <div class="grid2"><section class="card"><div class="card-h"><h2>${T('วันนี้รายชั่วโมง','Today by hour')}</h2></div>${bars(by,{label:'hourly'})}</section><section class="card"><div class="card-h"><h2>${T('14 วันข้างหน้า','Next 14 days')}</h2></div>${bars(days,{label:'daily'})}</section></div>`;
};

/* ----- customers (CRM) ----- */
VIEWS.customers=()=>{
  const ids=[...new Set(myBookings().map(b=>b.cust))],q=(STATE.q.cu||'').toLowerCase();
  let cs=ids.map(id=>{const c=custById(id),bs=myBookings().filter(b=>b.cust===id&&b.status!=='cancelled');return {c,n:bs.length,spend:bs.reduce((a,b)=>a+b.amount,0),last:bs.map(b=>b.date).sort().pop()||''}});
  if(q)cs=cs.filter(x=>(x.c.name+' '+x.c.country+' '+x.c.tags.join(' ')).toLowerCase().includes(q));
  cs.sort((a,b)=>b.spend-a.spend);
  const ctry={};cs.forEach(x=>ctry[x.c.country]=(ctry[x.c.country]||0)+1);
  return `<div class="vh"><div><h1>${T('ลูกค้า (CRM)','Customers (CRM)')}</h1><p class="sub">${T('ประวัติการจอง ยอดใช้จ่าย ภาษา และความต้องการพิเศษของลูกค้าทุกคน','Booking history, spend, language and special needs for every customer')}</p></div><div class="vh-a"><button class="btn ghost" id="cuCsv">${SVG(IC.download)}CSV</button></div></div>
  <div class="grid2 g31"><div>
  <div class="toolbar"><label class="search">${SVG(IC.search)}<input id="cuQ" value="${esc(STATE.q.cu||'')}" placeholder="${T('ค้นหาชื่อ ประเทศ หรือแท็ก','Search name, country or tag')}"></label><span class="count">${cs.length} ${T('คน','people')}</span></div>
  ${table([{l:T('ลูกค้า','Customer'),f:x=>`<b>${esc(x.c.name)}</b> ${flag(x.c.country)}${x.c.tags.map(t=>` <span class="tag">${esc(t)}</span>`).join('')}<br><small class="muted">${x.c.lang.toUpperCase()}${x.c.diet?' · '+esc(x.c.diet):''}${x.c.access?' · '+esc(x.c.access):''}</small>`},{l:T('ครั้ง','Visits'),r:1,f:x=>x.n},{l:T('ยอดใช้จ่าย','Spend'),r:1,f:x=>money(x.spend)},{l:T('ล่าสุด','Last'),f:x=>x.last?fmtD(x.last):'—'}],cs,{rowAttr:x=>`data-cu="${x.c.id}" tabindex="0"`})}</div>
  <section class="card"><div class="card-h"><h2>${T('ลูกค้ามาจากไหน','Where they’re from')}</h2></div>${hbars(Object.entries(ctry).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,v])=>({l:flag(k)+' '+k,v})))}</section></div>`;
};
BIND.customers=v=>{let qt;$('#cuQ',v).oninput=e=>{STATE.q.cu=e.target.value;clearTimeout(qt);qt=setTimeout(()=>{render();const i=$('#cuQ');i.focus();i.setSelectionRange(i.value.length,i.value.length)},250)};
  $$('[data-cu]',v).forEach(r=>r.onclick=()=>custDetail(r.dataset.cu));
  $('#cuCsv',v).onclick=()=>csv('customers',[['name','country','language','diet','access','tags']].concat([...new Set(myBookings().map(b=>b.cust))].map(id=>{const c=custById(id);return [c.name,c.country,c.lang,c.diet,c.access,c.tags.join(' ')]})))};
function custDetail(id){const c=custById(id),bs=myBookings().filter(b=>b.cust===id).sort((a,b)=>b.date.localeCompare(a.date));
  drawer(c.name,`<div class="bd-grid"><div><small>${T('ประเทศ / ภาษา','Country / language')}</small><b>${flag(c.country)} ${c.country} · ${c.lang.toUpperCase()}</b></div><div><small>${T('ผู้ร่วมเดินทาง','Party')}</small><b>${c.party}</b></div><div><small>${T('อาหาร','Diet')}</small><b>${esc(c.diet||'—')}</b></div><div><small>${T('การเข้าถึง','Accessibility')}</small><b>${esc(c.access||'—')}</b></div></div>
   <div class="fld full"><label>${T('บันทึกภายใน (ลูกค้าไม่เห็น)','Internal notes (customer can’t see)')}</label><textarea id="cuN" rows="3">${esc(c.notes||'')}</textarea></div>
   <label class="fld tog"><span>VIP</span><input type="checkbox" class="sw" id="cuV"${c.tags.includes('VIP')?' checked':''}></label>
   <h3 class="h3">${T('ประวัติการจอง','Booking history')}</h3><ul class="list">${bs.map(b=>`<li data-bk="${b.id}" tabindex="0"><span class="when"><b>${fmtD(b.date)}</b></span><span class="lm"><b>${esc(itemName(b))}</b><small>${money(b.amount)}</small></span>${pill(b.status)}</li>`).join('')}</ul>
   <div class="dr-foot"><button class="btn ghost" id="cuM">${SVG(IC.chat)}${T('ส่งข้อความ','Message')}</button><span class="sp"></span><button class="btn primary" id="cuS">${T('บันทึก','Save')}</button></div>`,bd=>{
    $('#cuS',bd).onclick=()=>{c.notes=$('#cuN',bd).value;const v=$('#cuV',bd).checked;c.tags=c.tags.filter(t=>t!=='VIP').concat(v?['VIP']:[]);save();closeDrawer();render();toast(T('บันทึกแล้ว','Saved'))};
    $('#cuM',bd).onclick=()=>{closeDrawer();openThread(threadFor('customer',id).id)}},true)}

/* ----- reviews ----- */
VIEWS.reviews=()=>{
  const rv=DB.reviews.filter(r=>r.org===me().id).sort((a,b)=>b.at-a.at),avg=rv.length?rv.reduce((a,r)=>a+r.stars,0)/rv.length:0;
  const dist=[5,4,3,2,1].map(s=>({l:'★'.repeat(s),v:rv.filter(r=>r.stars===s).length,c:'#E6A23C'}));
  return `<div class="vh"><div><h1>${T('รีวิว','Reviews')}</h1><p class="sub">${T('รีวิวจากลูกค้าที่ใช้บริการจริงผ่าน Journey ตอบกลับได้ คำตอบแสดงในแอป','Reviews from verified Journey customers. Your replies appear in the app.')}</p></div></div>
  <div class="grid2 g13"><section class="card rv-sum"><b class="big">${avg?avg.toFixed(1):'–'}</b><span class="stars">${'★'.repeat(Math.round(avg))}${'☆'.repeat(5-Math.round(avg))}</span><small>${T(rv.length+' รีวิว',rv.length+' reviews')} · ${T('ยังไม่ตอบ ','unanswered ')}${rv.filter(r=>!r.reply).length}</small>${hbars(dist)}</section>
  <div class="rv-list">${rv.map(r=>{const c=custById(r.cust)||{name:'Guest',country:''};return `<article class="card rv"><div class="rv-h"><b>${esc(c.name)} ${flag(c.country)}</b><span class="stars">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)}</span><small class="muted">${rel(r.at)}</small></div><p>${esc(r.text)}</p>${r.reply?`<div class="rv-rep"><small>${T('คำตอบของคุณ','Your reply')}</small><p>${esc(r.reply)}</p></div>`:`<div class="rv-form"><textarea data-rvt="${r.id}" rows="2" placeholder="${T('ตอบกลับอย่างสุภาพ…','Write a reply…')}"></textarea><button class="btn primary sm" data-rv="${r.id}">${T('ตอบกลับ','Reply')}</button></div>`}</article>`}).join('')||`<div class="empty">${SVG(IC.star,1.5)}<span>${T('ยังไม่มีรีวิว','No reviews yet')}</span></div>`}</div></div>`;
};
BIND.reviews=v=>$$('[data-rv]',v).forEach(b=>b.onclick=()=>{const t=$(`[data-rvt="${b.dataset.rv}"]`,v).value.trim();if(!t)return;DB.reviews.find(r=>r.id===b.dataset.rv).reply=t;save();render();toast(T('ตอบกลับแล้ว','Reply posted'))});

/* ----- shared packages (built from partners' offers) ----- */
VIEWS.packages=()=>{
  const mine=DB.packages.filter(p=>p.owner===me().id||p.items.some(i=>(DB.offers.find(o=>o.id===i)||{}).org===me().id));
  return `<div class="vh"><div><h1>${T('แพ็กเกจร่วม','Shared packages')}</h1><p class="sub">${T('รวมบริการของคุณกับพาร์ทเนอร์เป็นแพ็กเกจเดียว ลูกค้าจ่ายครั้งเดียว ระบบแบ่งเงินให้แต่ละรายอัตโนมัติ','Bundle your services with partners’. One payment from the customer, split to each partner automatically.')}</p></div><div class="vh-a"><button class="btn primary" id="pkNew">${SVG(IC.plus,2.2)}${T('สร้างแพ็กเกจ','New package')}</button></div></div>
  <div class="pk-grid">${mine.map(p=>{const its=p.items.map(i=>DB.offers.find(o=>o.id===i)).filter(Boolean),cost=its.reduce((a,o)=>a+o.price,0),orgs=[...new Set(its.map(o=>o.org))];
   return `<article class="card pk"><div class="card-h"><h2>${esc(p.name)}</h2>${pill(p.status)}</div><ul class="pk-it">${its.map(o=>`<li><span>${esc(o.name)}</span><small>${esc(orgById(o.org).name)}</small><b>${money(o.price)}</b></li>`).join('')}</ul>
    <div class="pk-f"><span>${T('ราคาขาย','Price')} <b>${money(p.price)}</b></span><span>${T('ต้นทุนรวม','Partner cost')} ${money(cost)}</span><span>${T('ขายแล้ว','Sold')} <b>${p.sold||0}</b></span></div>
    <div class="pk-org">${orgs.map(id=>{const o=orgById(id);return `<span class="org-av sm" title="${esc(o.name)}" style="background:${o.color}">${esc(o.name[0])}</span>`}).join('')}<button class="btn ghost sm" data-pk="${p.id}">${T('แก้ไข','Edit')}</button></div></article>`}).join('')||`<div class="empty">${SVG(IC.package,1.5)}<span>${T('ยังไม่มีแพ็กเกจ','No packages yet')}</span></div>`}</div>`;
};
BIND.packages=v=>{$('#pkNew',v).onclick=()=>pkEdit();$$('[data-pk]',v).forEach(b=>b.onclick=()=>pkEdit(b.dataset.pk))};
function pkEdit(id){
  const p=id?DB.packages.find(x=>x.id===id):{id:uid('pk'),name:'',items:[],price:0,status:'draft',owner:me().id,sold:0};
  const linked=new Set(DB.links.filter(l=>(l.a===me().id||l.b===me().id)&&l.status==='active').map(l=>l.a===me().id?l.b:l.a).concat([me().id]));
  const offers=DB.offers.filter(o=>linked.has(o.org)).concat(myOwnOffers());
  const paint=()=>{const its=p.items.map(i=>offers.find(o=>o.id===i)||DB.offers.find(o=>o.id===i)).filter(Boolean),cost=its.reduce((a,o)=>a+o.price,0);
    drawer(id?T('แก้ไขแพ็กเกจ','Edit package'):T('สร้างแพ็กเกจ','New package'),`<div class="form"><div class="fld full"><label>${T('ชื่อแพ็กเกจ','Package name')}</label><input id="pkN" value="${esc(p.name)}"></div></div>
     <h3 class="h3">${T('บริการที่เลือกได้ (จากพาร์ทเนอร์ที่เชื่อมต่อ)','Available services (from connected partners)')}</h3>
     <ul class="list">${offers.map(o=>`<li><span class="lm"><b>${esc(o.name)}</b><small>${esc(orgById(o.org).name)}</small></span><b>${money(o.price)}</b><button class="btn ghost sm" data-add="${o.id}">${SVG(IC.plus,2.2)}</button></li>`).join('')}</ul>
     <h3 class="h3">${T('ในแพ็กเกจ','In this package')} (${its.length})</h3>
     <ul class="list">${its.map((o,i)=>`<li><span class="lm"><b>${esc(o.name)}</b><small>${esc(orgById(o.org).name)}</small></span><b>${money(o.price)}</b><button class="btn ghost sm" data-rm="${i}">${SVG(IC.trash)}</button></li>`).join('')||`<li class="muted">${T('ยังไม่ได้เลือก','Nothing added')}</li>`}</ul>
     <div class="form"><div class="fld"><label>${T('ราคาขาย (บาท)','Selling price (THB)')}</label><input id="pkP" type="number" value="${p.price||cost}"></div><div class="fld"><label>${T('สถานะ','Status')}</label><select id="pkS"><option value="draft"${p.status==='draft'?' selected':''}>${T('ฉบับร่าง','Draft')}</option><option value="published"${p.status==='published'?' selected':''}>${T('เผยแพร่ในแอป','Published in app')}</option></select></div></div>
     <p class="note">${SVG(IC.info)}${T('ต้นทุนพาร์ทเนอร์รวม ','Partner cost ')}${money(cost)} · ${T('ส่วนต่างของคุณ ','your margin ')}<b>${money((p.price||cost)-cost)}</b></p>
     <div class="dr-foot">${id?`<button class="btn ghost danger" id="pkD">${SVG(IC.trash)}</button>`:''}<span class="sp"></span><button class="btn primary" id="pkSv">${T('บันทึก','Save')}</button></div>`,bd=>{
      const keep=()=>{p.name=$('#pkN',bd).value;p.price=+$('#pkP',bd).value;p.status=$('#pkS',bd).value};
      $$('[data-add]',bd).forEach(b=>b.onclick=()=>{keep();p.items.push(b.dataset.add);paint()});
      $$('[data-rm]',bd).forEach(b=>b.onclick=()=>{keep();p.items.splice(+b.dataset.rm,1);paint()});
      $('#pkSv',bd).onclick=()=>{keep();if(!p.name.trim()){toast(T('ตั้งชื่อแพ็กเกจก่อน','Give the package a name'));return}if(!id)DB.packages.push(p);save();closeDrawer();render();toast(T('บันทึกแล้ว','Saved'))};
      $('#pkD',bd)&&($('#pkD',bd).onclick=()=>confirmBox(T('ลบแพ็กเกจนี้?','Delete this package?'),()=>{DB.packages=DB.packages.filter(x=>x!==p);save();closeDrawer();render()},true));
    },true)};
  paint();
}
function myOwnOffers(){const o=me().id,out=[];
  (R().rooms||[]).forEach(r=>out.push({id:'own_'+r.id,org:o,name:r.name+T(' (1 คืน)',' (1 night)'),price:r.price}));
  (R().products||[]).forEach(p=>out.push({id:'own_'+p.id,org:o,name:p.name,price:p.price}));
  (R().routes||[]).forEach(r=>out.push({id:'own_'+r.id,org:o,name:r.name,price:r.price}));
  out.forEach(x=>{if(!DB.offers.find(y=>y.id===x.id))DB.offers.push(x)});return out}

/* ----- finance ----- */
VIEWS.finance=()=>{
  if(!can('finance'))return noAccess();
  const bs=myBookings().filter(b=>b.status==='done'||b.status==='inprogress'),m0=iso(-29);
  const gross=bs.filter(b=>b.date>=m0).reduce((a,b)=>a+b.amount,0),fee=gross*.12;
  const refIn=DB.links.filter(l=>(l.a===me().id||l.b===me().id)&&l.status==='active');
  const refEarn=myBookings().filter(b=>b.src==='partner'&&b.date>=m0).reduce((a,b)=>a+b.amount*.08,0);
  const po=DB.payouts.filter(p=>p.org===me().id).sort((a,b)=>b.date.localeCompare(a.date));
  const weeks=[...Array(8)].map((_,i)=>{const a=iso(-7*(7-i)-6),z=iso(-7*(7-i));return {l:fmtD(a),v:myBookings().filter(b=>b.status!=='cancelled'&&b.date>=a&&b.date<=z).reduce((s,b)=>s+b.amount,0)}});
  return `<div class="vh"><div><h1>${T('การเงินและการจ่ายเงิน','Finance & payouts')}</h1><p class="sub">${T('ยอดขาย ค่าบริการแพลตฟอร์ม ค่าแนะนำระหว่างพาร์ทเนอร์ และรอบโอนเงินรายสัปดาห์','Sales, platform fees, partner referral shares and weekly payouts')}</p></div><div class="vh-a"><button class="btn ghost" id="fiCsv">${SVG(IC.download)}CSV</button></div></div>
  <div class="kpis">${kpi(T('ยอดขาย 30 วัน','Gross, 30 days'),money(gross),'','wallet','acc')}${kpi(T('ค่าบริการแพลตฟอร์ม (12%)','Platform fee (12%)'),money(fee),'','percent')}${kpi(T('ค่าแนะนำที่จ่ายพาร์ทเนอร์','Referral shares paid'),money(refEarn),T(refIn.length+' พาร์ทเนอร์',refIn.length+' partners'),'network')}${kpi(T('ยอดสุทธิ','Net'),money(gross-fee-refEarn),T('รอโอน ','pending ')+money((po.find(p=>p.status==='pending')||{amount:0}).amount),'chart')}</div>
  <div class="grid2"><section class="card"><div class="card-h"><h2>${T('ยอดขายรายสัปดาห์','Weekly sales')}</h2></div>${bars(weeks,{money:true,label:'weekly'})}</section>
  <section class="card"><div class="card-h"><h2>${T('รอบการโอนเงิน','Payouts')}</h2><span class="muted">${T('โอนทุกวันจันทร์','Every Monday')}</span></div>${table([{l:T('วันที่','Date'),f:p=>fmtD(p.date)},{l:T('ยอด','Amount'),r:1,f:p=>money(p.amount)},{l:T('สถานะ','Status'),f:p=>pill(p.status)}],po)}</section></div>`;
};
BIND.finance=v=>{const b=$('#fiCsv',v);b&&(b.onclick=()=>csv('finance',[['booking','date','customer','amount','platform_fee','status']].concat(myBookings().map(x=>[x.id,x.date,cName(x.cust),x.amount,Math.round(x.amount*.12),x.status]))))};
const noAccess=()=>`<div class="empty">${SVG(IC.lock,1.5)}<span>${T('บทบาทของคุณดูส่วนนี้ไม่ได้ ติดต่อเจ้าของบัญชี','Your role can’t open this section. Ask the account owner.')}</span></div>`;

/* ----- reports: customer → destination funnel and data ----- */
VIEWS.reports=()=>{
  const o=me().id,tr=DB.trips.filter(t=>t.legs.some(l=>l.org===o));
  const src={};myBookings().forEach(b=>src[b.src]=(src[b.src]||0)+1);
  const ctry={};tr.forEach(t=>{const c=custById(t.cust).country;ctry[c]=(ctry[c]||0)+1});
  const lead=[];DB.bookings.filter(b=>b.org===o&&b.created).forEach(b=>lead.push(Math.max(0,Math.round((new Date(b.date+'T00:00')-b.created)/864e5))));
  const leadB=[['0–3',0,3],['4–7',4,7],['8–14',8,14],['15–30',15,30],['30+',31,999]].map(([l,a,z])=>({l,v:lead.filter(x=>x>=a&&x<=z).length}));
  // what customers do before/after us, across partners
  const before={},after={};tr.forEach(t=>{const i=t.legs.findIndex(l=>l.org===o);const p=t.legs[i-1],n=t.legs[i+1];if(p){const k=p.org?orgById(p.org).name:kLbl(p.kind);before[k]=(before[k]||0)+1}if(n){const k=n.org?orgById(n.org).name:kLbl(n.kind);after[k]=(after[k]||0)+1}});
  const stage=[[T('เดินทางมาถึง','Arrived'),tr.length],[T('ใช้รถรับส่ง','Took a transfer'),tr.filter(t=>t.legs.some(l=>l.kind==='transport')).length],[T('เข้าพัก','Stayed'),tr.filter(t=>t.legs.some(l=>l.kind==='stay')).length],[T('ทานอาหาร','Dined'),tr.filter(t=>t.legs.some(l=>l.kind==='dine')).length],[T('ทำกิจกรรม/ทัวร์','Did an activity'),tr.filter(t=>t.legs.some(l=>l.kind==='tour')).length],[T('เข้าชมสถานที่','Visited an attraction'),tr.filter(t=>t.legs.some(l=>l.kind==='attraction')).length]];
  const avgN=tr.length?(tr.reduce((a,t)=>a+(new Date(t.depart)-new Date(t.arrive))/864e5,0)/tr.length).toFixed(1):0;
  const spend=tr.length?DB.bookings.filter(b=>tr.some(t=>t.id===b.trip)&&b.status!=='cancelled').reduce((a,b)=>a+b.amount,0)/tr.length:0;
  return `<div class="vh"><div><h1>${T('รายงานและข้อมูล','Reports & data')}</h1><p class="sub">${T('ข้อมูลตั้งแต่ลูกค้ามาถึงจนเดินทางกลับ รวมจากทุกพาร์ทเนอร์ที่ลูกค้าใช้บริการ (เฉพาะข้อมูลที่ยินยอม ไม่ระบุตัวตน)','From arrival to departure, combined across every partner the customer used (consented, anonymised)')}</p></div></div>
  <div class="kpis">${kpi(T('ลูกค้าที่ผ่านธุรกิจคุณ','Trips through you'),num(tr.length),'','users')}${kpi(T('พักเฉลี่ยในจังหวัด','Avg. nights in destination'),avgN,T('คืน','nights'),'bed')}${kpi(T('ใช้จ่ายเฉลี่ยต่อทริป (ทุกพาร์ทเนอร์)','Avg. spend per trip (all partners)'),money(spend),'','wallet','acc')}${kpi(T('จองล่วงหน้าเฉลี่ย','Avg. lead time'),lead.length?Math.round(lead.reduce((a,b)=>a+b,0)/lead.length):0,T('วัน','days'),'calendar')}</div>
  <section class="card"><div class="card-h"><h2>${T('เส้นทางลูกค้า: มาถึง → จุดหมาย','Journey funnel: arrival → destination')}</h2></div><div class="funnel">${stage.map(([l,v],i)=>`<div class="fn" style="--w:${tr.length?v/tr.length*100:0}%"><span>${l}</span><i></i><b>${v}</b><small>${tr.length?Math.round(v/tr.length*100):0}%</small></div>`).join('')}</div></section>
  <div class="grid2"><section class="card"><div class="card-h"><h2>${T('ก่อนมาหาคุณ ลูกค้ามาจาก','Before you, customers came from')}</h2></div>${hbars(Object.entries(before).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([l,v])=>({l:esc(l),v})))}</section>
  <section class="card"><div class="card-h"><h2>${T('หลังจากคุณ ลูกค้าไปต่อที่','After you, customers went to')}</h2></div>${hbars(Object.entries(after).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([l,v])=>({l:esc(l),v})))}</section></div>
  <div class="grid2"><section class="card"><div class="card-h"><h2>${T('ช่องทางการจอง','Booking channels')}</h2></div>${hbars(Object.entries(src).map(([k,v])=>({l:esc(T(...SRC[k])),v})))}</section>
  <section class="card"><div class="card-h"><h2>${T('จองล่วงหน้ากี่วัน','Booking lead time (days)')}</h2></div>${bars(leadB,{label:'lead',h:140})}</section></div>
  <section class="card"><div class="card-h"><h2>${T('สัญชาติลูกค้า','Customer nationalities')}</h2></div>${hbars(Object.entries(ctry).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([k,v])=>({l:flag(k)+' '+k,v})))}</section>`;
};

/* =====================================================================
   VIEWS (3): inbox & trip rooms, network, team, settings, government
   ===================================================================== */
function threadFor(kind,withId){let t=DB.threads.find(x=>x.org===me().id&&x.kind===kind&&x.with===withId);if(!t){t={id:uid('th'),org:me().id,kind,with:withId,msgs:[],unread:0};DB.threads.push(t);save()}return t}
function tripRoom(tr){let t=DB.threads.find(x=>x.kind==='trip'&&x.with===tr.id);
  if(!t){const orgs=[...new Set(tr.legs.filter(l=>l.org).map(l=>l.org))];t={id:uid('th'),org:'*',kind:'trip',with:tr.id,members:orgs,msgs:[{from:'sys',text:T('ห้องแชทสำหรับประสานงานทริปนี้ ลูกค้าและพาร์ทเนอร์ทุกรายในทริปเห็นข้อความเดียวกัน','Coordination room for this trip — the customer and every partner on it see the same messages'),at:Date.now()}],unread:0};DB.threads.push(t);save()}return t}
const thVisible=t=>t.org===me().id||(t.kind==='trip'&&(t.members||[]).includes(me().id));
function thTitle(t){if(t.kind==='customer'){const c=custById(t.with);return c?c.name+' '+flag(c.country):'—'}if(t.kind==='trip'){const tr=DB.trips.find(x=>x.id===t.with);return T('ทริปของ ','Trip: ')+(tr?cName(tr.cust):'')}const o=orgById(t.with);return o?o.name:'—'}
function thSub(t){if(t.kind==='trip'){const tr=DB.trips.find(x=>x.id===t.with);return tr?fmtD(tr.arrive)+' – '+fmtD(tr.depart)+' · '+(t.members||[]).length+T(' พาร์ทเนอร์',' partners'):''}if(t.kind==='customer')return T('ลูกค้า','Customer');const o=orgById(t.with);return o?o.types.map(kName).join(' · '):''}
const TH_IC={customer:'users',partner:'network',gov:'landmark',trip:'route'};
VIEWS.inbox=()=>{
  const f=STATE.f.ib||'all',ths=DB.threads.filter(thVisible).filter(t=>f==='all'||t.kind===f).sort((a,b)=>((b.msgs.at(-1)||{}).at||0)-((a.msgs.at(-1)||{}).at||0));
  const sel=ths.find(t=>t.id===STATE.sel)||null;
  return `<div class="vh"><div><h1>${T('กล่องข้อความ','Inbox')}</h1><p class="sub">${T('คุยกับลูกค้า พาร์ทเนอร์ หน่วยงานรัฐ และห้องแชทของแต่ละทริป ในที่เดียว','Customers, partners, government and per-trip rooms in one place')}</p></div><div class="vh-a"><button class="btn primary" id="ibNew">${SVG(IC.plus,2.2)}${T('ข้อความใหม่','New message')}</button></div></div>
  <div class="toolbar"><div class="seg">${[['all',T('ทั้งหมด','All')],['customer',T('ลูกค้า','Customers')],['partner',T('พาร์ทเนอร์','Partners')],['trip',T('ห้องทริป','Trip rooms')],['gov',T('หน่วยงานรัฐ','Government')]].map(([k,l])=>`<button data-ib="${k}" aria-pressed="${f===k}">${l}</button>`).join('')}</div></div>
  <div class="chat-wrap${sel?' has-sel':''}"><ul class="th-list">${ths.map(t=>{const m=t.msgs.at(-1)||{};return `<li><button data-th="${t.id}" class="${sel===t?'on':''}${t.unread?' unread':''}"><span class="th-ic">${SVG(IC[TH_IC[t.kind]])}</span><span class="lm"><b>${thTitle(t)}</b><small>${esc((m.text||'').slice(0,70))}</small></span><em>${m.at?rel(m.at):''}</em></button></li>`}).join('')||`<li class="muted pad">${T('ยังไม่มีข้อความ','No conversations')}</li>`}</ul>
  <section class="chat">${sel?chatHTML(sel):`<div class="empty">${SVG(IC.chat,1.5)}<span>${T('เลือกบทสนทนา','Pick a conversation')}</span></div>`}</section></div>`;
};
function chatHTML(t){
  const who=m=>m.from==='me'||m.from===me().id?'me':m.from==='sys'?'sys':'them';
  const nm=m=>{if(m.from==='sys')return '';if(who(m)==='me')return '';const o=orgById(m.from);if(o)return o.name;const c=custById(m.from);return c?c.name:''};
  const tr=t.kind==='trip'?DB.trips.find(x=>x.id===t.with):null;

function openThread(id){STATE.sel=id;if(STATE.view!=='inbox'){STATE.view='inbox';try{history.replaceState(null,'','#inbox')}catch(e){}}render();}
BIND.inbox=v=>{
  $$('[data-ib]',v).forEach(b=>b.onclick=()=>{STATE.f.ib=b.dataset.ib;STATE.sel=null;render()});
  $$('[data-th]',v).forEach(b=>b.onclick=()=>{STATE.sel=b.dataset.th;const t=DB.threads.find(x=>x.id===b.dataset.th);t.unread=0;save();render()});
  $('#ibNew',v).onclick=newMessage;
  const t=DB.threads.find(x=>x.id===STATE.sel);if(!t)return;if(t.unread){t.unread=0;save();renderNav()}
  const ms=$('#msgs',v);ms.scrollTop=ms.scrollHeight;
  const send=txt=>{if(!txt.trim())return;t.msgs.push({from:'me',text:txt.trim(),at:Date.now()});save();render();setTimeout(()=>autoReply(t),1400)};
  $('#chF',v).onsubmit=e=>{e.preventDefault();send($('#chT',v).value)};
  $$('[data-q]',v).forEach(b=>b.onclick=()=>send(b.dataset.q));
  $('#chBack',v).onclick=()=>{STATE.sel=null;render()};
  $('#chTrip',v)&&($('#chTrip',v).onclick=()=>{const tr=DB.trips.find(x=>x.id===t.with);drawer(thTitle(t),journeyTimeline(tr),null,true)});

};
function autoReply(t){if(t._r)return;t._r=1;
  const from=t.kind==='customer'?t.with:t.kind==='trip'?(t.members||[]).find(x=>x!==me().id)||'sys':t.with;
  t.msgs.push({from,text:t.kind==='customer'?'Thank you! 🙏':T('รับทราบครับ','Noted, thank you'),at:Date.now()});save();if(STATE.view==='inbox'&&STATE.sel===t.id)render()}
function newMessage(){
  const linked=DB.links.filter(l=>(l.a===me().id||l.b===me().id)).map(l=>l.a===me().id?l.b:l.a);
  const custs=[...new Set(myBookings().map(b=>b.cust))].slice(0,40);

   <h3 class="h3">${T('ลูกค้า','Customers')}</h3><ul class="list">${custs.map(id=>{const c=custById(id);return `<li data-nm="customer|${id}" tabindex="0"><span class="lm"><b>${esc(c.name)} ${flag(c.country)}</b></span></li>`}).join('')}</ul>`,bd=>$$('[data-nm]',bd).forEach(x=>x.onclick=()=>{const [k,id]=x.dataset.nm.split('|');closeDrawer();openThread(threadFor(k,id).id)}));

/* ----- partner network ----- */
VIEWS.network=()=>{

  all.sort((a,b)=>(link(b.id)?1:0)-(link(a.id)?1:0)||(a.prov===o.prov?-1:1));
  const act=DB.links.filter(l=>(l.a===o.id||l.b===o.id)&&l.status==='active').length;

  <div class="kpis">${kpi(T('เชื่อมต่อแล้ว','Connected'),act,'','network')}${kpi(T('ลูกค้าที่ส่งต่อกัน 30 วัน','Referred customers, 30 days'),myBookings().filter(b=>b.src==='partner').length,'','route')}</div>
  <div class="toolbar"><label class="search">${SVG(IC.search)}<input id="nwQ" value="${esc(STATE.q.nw||'')}" placeholder="${T('ค้นหาธุรกิจหรือพื้นที่','Search business or area')}"></label><select id="nwK"><option value="all">${T('ทุกประเภท','All types')}</option>${['stay','dine','transport','tour','attraction'].map(k=>`<option value="${k}"${fk===k?' selected':''}>${kName(k)}</option>`).join('')}</select></div>
  ${all.length?'':`<div class="empty">${SVG(IC.network,1.5)}<span>${T('ยังไม่มีธุรกิจอื่นในระบบตามตัวกรองนี้ เมื่อเชื่อมฐานข้อมูลจริงจะเห็นธุรกิจในจังหวัดของคุณที่นี่','No other businesses match yet. Once the live database is connected you\u2019ll see businesses in your province here.')}</span></div>`}<div class="nw-grid">${all.map(x=>{const l=link(x.id);return `<article class="card nw"><div class="nw-h"><span class="org-av" style="background:${x.color}">${esc(x.name[0])}</span><span class="lm"><b>${esc(x.name)}${x.verified?SVG(IC.badge,2,'vf'):''}</b><small>${esc(x.district)}, ${esc(pName(x.prov))}</small></span></div><div class="nw-k">${x.types.map(kChip).join('')}</div><div class="nw-m"><span>★ ${x.rating}</span><span>${num(x.reviews)} ${T('รีวิว','reviews')}</span>${l&&l.status==='active'?`<span>${T('ค่าแนะนำ ','referral ')}${l.comm}%</span>`:''}</div>
   <div class="nw-a">${l?l.status==='active'?`<span class="pill" style="--c:#1F9D6B">${T('เชื่อมต่อแล้ว','Connected')}</span><button class="btn ghost sm" data-nwc="${x.id}">${SVG(IC.chat)}</button><button class="btn ghost sm" data-nws="${x.id}">${SVG(IC.gear)}</button>`:`<span class="pill" style="--c:#C2830C">${T('รอตอบรับ','Pending')}</span>`:`<button class="btn primary sm" data-nwa="${x.id}">${SVG(IC.plus,2.2)}${T('ขอเชื่อมต่อ','Connect')}</button>`}</div></article>`}).join('')}</div>`;

function linkForm(id,edit){const o=orgById(id),l=DB.links.find(x=>(x.a===me().id&&x.b===id)||(x.b===me().id&&x.a===id))||{a:me().id,b:id,comm:10,status:'pending',share:true};

    $('#lkOk',bd).onclick=()=>{l.comm=+$('#lkC',bd).value;l.share=$('#lkS',bd).checked;if(!DB.links.includes(l))DB.links.push(l);const m=$('#lkM',bd).value.trim();if(m)threadFor('partner',id).msgs.push({from:'me',text:m,at:Date.now()});
      if(!edit){setTimeout(()=>{l.status='active';DB.notifs.unshift({id:uid('nf'),org:me().id,text:o.name+T(' ตอบรับการเชื่อมต่อแล้ว',' accepted your connection'),at:Date.now(),read:false});save();if(STATE.view==='network')render();else renderNav()},2500)}
